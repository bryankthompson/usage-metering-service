name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metering
          POSTGRES_PASSWORD: metering
          POSTGRES_DB: metering
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metering"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://metering:metering@localhost:5432/metering
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # the merge gate reads only the check named `test`, so every check is a step of it.
      - run: uvx ruff@0.8.6 format --check --diff .
      - run: uvx ruff@0.8.6 check .
      # mypy is pinned (an unpinned one can go red with no code change) and comes in with --with,
      # so pyproject.toml and uv.lock stay untouched. Settings are in mypy.ini; only app/ is checked.
      - run: uv run --with mypy==2.4.1 mypy app
      # coverage floor: app/ measured 97% on 2026-11-11, the floor is 92 (a drop of a few points fails the job).
      # pytest-cov comes in with --with so pyproject.toml and uv.lock stay untouched.
      - run: uv run --with pytest-cov pytest -q --cov=app --cov-fail-under=92
      - run: docker build -t usage-metering-service:ci .
      - run: docker compose config -q
