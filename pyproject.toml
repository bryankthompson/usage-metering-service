[project]
name = "usage-metering"
version = "0.1.0"
description = "Usage metering and billing prototype: idempotent event intake, hourly rollups, versioned pricing, Stripe test-mode entitlements."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "stripe>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
