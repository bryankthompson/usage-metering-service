# Lint rules: F (pyflakes: unused imports and names, undefined names) and E9 (syntax errors).
# Formatter is on (ruff format, checked in CI and pre-commit); mypy runs on app/ in CI (settings in mypy.ini).
# CI and pre-commit both run the pinned ruff 0.8.6, so this file is the only config.
line-length = 120
target-version = "py312"

[lint]
select = ["F", "E9"]
# B (bugbear) is not selected: 11 hits today, all B023 in tests (loop variables in closures), not worth a mass edit here.
# If B is added later, ignore B008 for FastAPI `Depends(...)` defaults.
