services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A named volume, so `docker compose down` (without -v) and a recreated container keep the data.
      - pgdata:/var/lib/postgresql/data
      # Postgres runs db/*.sql in filename order the first time the data volume is created.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -h 127.0.0.1"]  # TCP: the first-start init server only listens on a socket
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://metering:metering@db:5432/metering
      STRIPE_WEBHOOK_SECRET: whsec_test_only_not_a_real_secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  rollup:
    build: .
    environment:
      DATABASE_URL: postgresql://metering:metering@db:5432/metering
      # Empty means the ClickHouse mirror is off. With the analytics profile: CLICKHOUSE_URL=http://clickhouse:8123
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.rollup", "--every", "3600"]
    restart: unless-stopped

  # Optional derived copy of the rollups for analytics (docs/clickhouse.md). Not started by a plain `docker compose up`.
  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:25.8
    environment:
      # The image's default user is otherwise reachable from localhost only; this lets the other containers use it
      # without a password. The port is published on 127.0.0.1 only. Local, single node, no auth: not for a shared host.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
